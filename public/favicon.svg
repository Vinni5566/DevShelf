<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#F8F3E9" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#51443C" stroke-opacity="0.25" stroke-width="2" />
  <!-- Left Clothbound Book (Lavender) -->
  <rect x="11" y="16" width="12.5" height="32" rx="2" fill="#B7A3D0" stroke="#51443C" stroke-width="2" />
  <line x1="14.5" y1="22" x2="20" y2="22" stroke="#51443C" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center Book (Butter Yellow with Monogram) -->
  <rect x="23.5" y="11" width="17" height="37" rx="2" fill="#EBD99C" stroke="#51443C" stroke-width="2" />
  <circle cx="32" cy="24" r="3" fill="#51443C" fill-opacity="0.25" stroke="#51443C" stroke-width="1.5" />
  <line x1="28" y1="41" x2="36" y2="41" stroke="#51443C" stroke-width="1.5" stroke-linecap="round" />
  <!-- Right Leaning Book (Sage) -->
  <g transform="rotate(-7 46 30)">
    <rect x="40" y="17" width="12" height="31" rx="2" fill="#A9BBA2" stroke="#51443C" stroke-width="2" />
    <line x1="43" y1="23" x2="49" y2="23" stroke="#51443C" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <!-- Warm Walnut Shelf Base -->
  <rect x="9" y="48" width="46" height="5" rx="1.5" fill="#80634E" stroke="#51443C" stroke-width="1.8" />
</svg>